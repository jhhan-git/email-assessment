<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>제출물 확인</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <style>
    main { max-width: 1200px; }
    .topbar-inner { max-width: 1200px; }
    .login { max-width: 380px; margin: 60px auto; padding: 24px; }
    .login h2 { margin: 0 0 16px; font-size: 18px; }
    .login label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    .login input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
    .login .btn { width: 100%; justify-content: center; }
    .login .msg { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 10px; }

    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; }
    .bar input[type=search] { flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 20px; }
    .bar label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    .count { font-size: 14px; color: var(--muted); }

    .split { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
    .list { max-height: calc(100vh - 220px); overflow: auto; }
    .item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 12px 16px; cursor: pointer; }
    .item:hover { background: var(--surface-2); }
    .item.sel { background: var(--primary-soft); }
    .item .top { display: flex; gap: 8px; align-items: baseline; }
    .item .who { font-weight: 700; }
    .item .when { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .item .s { color: var(--text); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .meta { color: var(--muted); font-size: 12px; }
    .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 10px; background: #fef7e0; color: #8a5a00; margin-left: 4px; }
    .detail { padding: 20px; min-height: 300px; }
    .detail .empty { color: var(--muted); text-align: center; padding: 80px 0; }
    .detail .actions { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 12px; flex-wrap: wrap; }
    .detail .stu { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
    .exam { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 16px; margin-bottom: 16px; }
    .exam .spacer { flex: 1; }
    .exam input[type=datetime-local] { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; }
    .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
    .tabs button { border: 0; background: transparent; padding: 7px 14px; cursor: pointer; font-size: 14px; }
    .tabs button.on { background: var(--primary); color: #fff; font-weight: 600; }
    .tag.ok { background: var(--ok-soft); color: var(--ok); }
    .tag.wait { background: var(--primary-soft); color: #174ea6; }
    .class-row select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; background: var(--surface); }
    .class-row code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; color: var(--text); word-break: break-all; }
    .tag.cls { background: var(--primary); color: #fff; }
    .help { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }

    @media (max-width: 860px) {
      .split { grid-template-columns: 1fr; }
      .list { max-height: 50vh; }
    }
    @media print {
      .split { display: block; }
      .list, .bar, .detail .actions { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      </div>
      <h1>제출물 확인 <span style="font-weight:400;color:var(--muted);font-size:14px">교사용</span></h1>
      <span class="spacer"></span>
      <span id="who" style="font-size:13px;color:var(--muted)"></span>
      <button class="btn hidden" id="logoutBtn" type="button">로그아웃</button>
    </div>
  </div>

  <main>
    <div id="configNotice" class="notice hidden">config.js에 Supabase 주소와 키를 먼저 입력하세요.</div>

    <form class="card login hidden" id="loginView">
      <h2>교사 로그인</h2>
      <label>이메일 <input type="email" id="email" autocomplete="username" required></label>
      <label>비밀번호 <input type="password" id="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit" id="loginBtn">로그인</button>
      <div class="msg" id="loginMsg"></div>
    </form>

    <section id="appView" class="hidden">
      <div class="card exam class-row hidden" id="classRow">
        <b>반</b>
        <select id="classSel"></select>
        <span class="count" id="classLinkBox">학생 주소 <code id="classLink"></code> <button class="btn" id="copyLinkBtn" type="button">복사</button></span>
      </div>
      <div class="card exam">
        <b>시험 상태</b>
        <span class="pill" id="examPill">확인 중…</span>
        <span class="count" id="examInfo"></span>
        <span class="spacer"></span>
        <label class="count">마감 예약 <input type="datetime-local" id="closeAt"></label>
        <button class="btn" id="setCloseBtn" type="button">예약</button>
        <button class="btn" id="clearCloseBtn" type="button">예약 취소</button>
        <button class="btn" id="toggleBtn" type="button">…</button>
      </div>
      <div class="card bar">
        <div class="tabs"><button type="button" id="tabSub" class="on">제출물</button><button type="button" id="tabDraft">작성 중 자동저장</button></div>
        <input type="search" id="q" placeholder="학번, 이름, 제목, 받는 사람으로 검색">
        <label><input type="checkbox" id="latestOnly" checked> 학번별 마지막 제출만</label>
        <span class="count" id="count"></span>
        <button class="btn" id="reloadBtn" type="button">새로고침</button>
        <button class="btn" id="csvBtn" type="button">엑셀(CSV) 내려받기</button>
      </div>
      <div class="split">
        <div class="card list" id="list"></div>
        <div class="card detail" id="detail"><div class="empty">왼쪽 목록에서 제출물을 선택하세요.</div></div>
      </div>
    </section>
  </main>

<script>
(function () {
  const CFG = window.APP_CONFIG || {};
  const $ = (id) => document.getElementById(id);
  if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || !window.supabase) {
    $("configNotice").classList.remove("hidden");
    return;
  }
  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  let rows = [], drafts = [], selectedId = null, mode = "sub", exam = null, examNote = "";

  // ---------- 반 선택 (config.js의 CLASSES) ----------
  const CLASSES = CFG.CLASSES || [];
  const ALL = "*";
  let curClass = ALL;
  const className = (id) => (CLASSES.find((c) => c.id === id) || {}).name || (id ? id + "반" : "반 없음");
  const studentBase = location.href.replace(/teacher\.html.*$/, "").replace(/[?#].*$/, "");
  if (CLASSES.length) {
    $("classRow").classList.remove("hidden");
    const sel = $("classSel");
    CLASSES.forEach((c) => sel.appendChild(Object.assign(document.createElement("option"), { value: c.id, textContent: c.name })));
    sel.appendChild(Object.assign(document.createElement("option"), { value: ALL, textContent: "전체 반 보기" }));
    try { const saved = localStorage.getItem("teacher-class"); if (saved && [...sel.options].some((o) => o.value === saved)) curClass = saved; } catch (_) {}
    if (curClass === ALL) curClass = CLASSES[0].id;
    sel.value = curClass;
    sel.addEventListener("change", () => {
      curClass = sel.value;
      try { localStorage.setItem("teacher-class", curClass); } catch (_) {}
      selectedId = null; $("detail").innerHTML = '<div class="empty">왼쪽 목록에서 선택하세요.</div>';
      renderClassLink(); loadExam(); renderList();
    });
    $("copyLinkBtn").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText($("classLink").textContent); $("copyLinkBtn").textContent = "복사됨 ✓"; }
      catch (_) { prompt("주소를 복사하세요", $("classLink").textContent); }
      setTimeout(() => ($("copyLinkBtn").textContent = "복사"), 1500);
    });
  }
  function renderClassLink() {
    $("classLinkBox").classList.toggle("hidden", curClass === ALL);
    $("classLink").textContent = studentBase + "?class=" + encodeURIComponent(curClass);
  }
  if (CLASSES.length) renderClassLink();

  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function btn(label, cls, onClick) { const b = el("button", "btn " + (cls || ""), label); b.type = "button"; b.onclick = onClick; return b; }
  const fmtTime = (t) => new Date(t).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const fmtFull = (t) => new Date(t).toLocaleString("ko-KR", { timeZone: "Asia/Seoul" });
  const fmtSize = (n) => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB";
  const key = (no) => String(no || "").trim();

  // ---------- 로그인 ----------
  async function showForSession(session) {
    if (!session) {
      $("loginView").classList.remove("hidden"); $("appView").classList.add("hidden");
      $("logoutBtn").classList.add("hidden"); $("who").textContent = "";
      return;
    }
    const { data: ok, error } = await sb.rpc("is_teacher");
    if (error || !ok) {
      await sb.auth.signOut();
      $("loginMsg").textContent = "교사 명단(teachers 테이블)에 등록되지 않은 계정입니다.";
      return showForSession(null);
    }
    $("who").textContent = session.user.email;
    $("logoutBtn").classList.remove("hidden");
    $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden");
    loadExam(); load();
  }
  $("loginView").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginMsg").textContent = ""; $("loginBtn").disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    $("loginBtn").disabled = false;
    if (error) { $("loginMsg").textContent = "로그인 실패: 이메일 또는 비밀번호를 확인하세요."; return; }
    showForSession(data.session);
  });
  $("logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); rows = []; drafts = []; showForSession(null); });
  sb.auth.getSession().then(({ data }) => showForSession(data.session));

  // ---------- 시험 상태 ----------
  function toLocalInput(t) {
    const d = new Date(t), pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function renderExam() {
    const pill = $("examPill"), info = $("examInfo"), tb = $("toggleBtn");
    if (!exam) {
      pill.className = "pill"; pill.textContent = examNote ? "반 선택" : "설정 필요";
      info.textContent = examNote || "Supabase에서 update-v2.sql을 실행하세요.";
      ["toggleBtn", "setCloseBtn", "clearCloseBtn", "closeAt"].forEach((id) => ($(id).disabled = true));
      return;
    }
    ["toggleBtn", "setCloseBtn", "clearCloseBtn", "closeAt"].forEach((id) => ($(id).disabled = false));
    pill.className = "pill " + (exam.open ? "open" : "closed");
    pill.textContent = (CLASSES.length ? className(curClass) + " · " : "") + (exam.open ? "진행 중 · 작성/제출 가능" : "마감됨 · 작성/제출 불가");
    const ca = exam.closes_at ? new Date(exam.closes_at) : null;
    if (ca && exam.open) {
      const mins = Math.max(0, Math.round((ca - new Date(exam.now)) / 60000));
      info.textContent = `${fmtFull(ca)} 자동 마감 예정 (약 ${mins}분 남음)`;
    } else if (ca && !exam.open && exam.manual_open) {
      info.textContent = `${fmtFull(ca)}에 자동 마감됨`;
    } else info.textContent = "";
    if (document.activeElement !== $("closeAt")) $("closeAt").value = ca ? toLocalInput(ca) : "";
    tb.textContent = exam.open ? "지금 마감하기" : "다시 열기";
    tb.className = "btn " + (exam.open ? "danger" : "primary");
  }
  async function loadExam() {
    examNote = "";
    if (CLASSES.length && curClass === ALL) {
      exam = null; examNote = "시험 시작·마감은 위에서 반을 고른 뒤 바꿀 수 있습니다."; return renderExam();
    }
    const want = curClass;
    const { data, error } = await sb.rpc("exam_status", CLASSES.length ? { p_class: curClass } : {});
    if (want !== curClass) return; // 그사이 반을 바꿈
    exam = error ? null : data;
    if (error && CLASSES.length && error.code === "PGRST202") examNote = "반별 시험 관리를 쓰려면 Supabase에서 update-v3.sql을 실행하세요.";
    renderExam();
  }
  async function setExam(open, closesAt) {
    const { data, error } = await sb.rpc("set_exam_status", CLASSES.length
      ? { p_class: curClass, p_open: open, p_closes_at: closesAt } : { p_open: open, p_closes_at: closesAt });
    if (error) { alert("변경 실패: " + error.message); return; }
    exam = data; renderExam();
  }
  $("toggleBtn").addEventListener("click", () => {
    if (exam.open) {
      if (!confirm(`${CLASSES.length ? className(curClass) + "을(를) " : ""}지금 마감할까요?\n학생 화면이 20초 안에 잠기고, 더 이상 작성·제출할 수 없습니다.`)) return;
      setExam(false, exam.closes_at);
    } else {
      const ca = exam.closes_at && new Date(exam.closes_at) > new Date(exam.now) ? exam.closes_at : null;
      if (!confirm(`${CLASSES.length ? className(curClass) + "을(를) " : ""}다시 열까요? 학생들이 다시 작성·제출할 수 있게 됩니다.` + (exam.closes_at && !ca ? "\n(지난 마감 예약은 지워집니다)" : ""))) return;
      setExam(true, ca);
    }
  });
  $("setCloseBtn").addEventListener("click", () => {
    const v = $("closeAt").value;
    if (!v) { alert("마감 날짜와 시각을 먼저 고르세요."); return; }
    const t = new Date(v);
    if (t <= new Date()) { alert("지금보다 나중 시각을 고르세요."); return; }
    setExam(exam.open, t.toISOString());
  });
  $("clearCloseBtn").addEventListener("click", () => { $("closeAt").value = ""; setExam(exam.open, null); });
  setInterval(() => { if (!$("appView").classList.contains("hidden")) loadExam(); }, 30000);

  // ---------- 목록 ----------
  async function fetchAll(table, cols) {
    const all = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from(table).select(cols).order("created_at", { ascending: false }).range(from, from + 999);
      if (error) throw error;
      all.push(...data);
      if (data.length < 1000) break;
    }
    return all;
  }
  async function load() {
    $("list").innerHTML = '<div style="padding:16px;color:var(--muted)">불러오는 중…</div>';
    try {
      rows = await fetchAll("submissions", "*");
      try { drafts = await fetchAll("drafts", "*"); } catch (_) { drafts = []; }
    } catch (error) {
      $("list").innerHTML = ""; $("list").appendChild(el("div", "notice", "불러오기 실패: " + error.message)); return;
    }
    drafts.sort((a, b) => b.updated_at.localeCompare(a.updated_at));
    renderList();
  }

  function submitCounts() {
    const c = {};
    rows.filter((r) => !CLASSES.length || curClass === ALL || (r.class_id || "") === curClass)
      .forEach((r) => (c[key(r.student_no)] = (c[key(r.student_no)] || 0) + 1));
    return c;
  }
  const inClass = (arr) => (CLASSES.length && curClass !== ALL ? arr.filter((r) => (r.class_id || "") === curClass) : arr);
  const draftAsMail = (d) => {
    const x = d.data || {};
    return { id: d.id, student_no: d.student_no, student_name: d.student_name, created_at: d.updated_at, sender: x.sender || "",
      to_addrs: x.to || [], cc_addrs: x.cc || [], bcc_addrs: x.bcc || [], subject: x.subject || "", body: x.body || "", signature: x.signature || "",
      attachments: [], restore_until: d.restore_until, class_id: d.class_id, _draft: true };
  };

  function visibleRows() {
    let list = mode === "sub" ? rows : drafts.map(draftAsMail);
    if (CLASSES.length && curClass !== ALL) list = list.filter((r) => (r.class_id || "") === curClass);
    if ($("latestOnly").checked) {
      const seen = new Set();
      list = list.filter((r) => { const k = key(r.student_no); if (seen.has(k)) return false; seen.add(k); return true; });
    }
    const q = $("q").value.trim().toLowerCase();
    if (q) list = list.filter((r) => [r.student_no, r.student_name, r.subject, ...(r.to_addrs || [])].join(" ").toLowerCase().includes(q));
    return list.slice().sort((a, b) => a.student_no.localeCompare(b.student_no, "ko", { numeric: true }) || b.created_at.localeCompare(a.created_at));
  }

  function renderList() {
    const list = visibleRows(), counts = submitCounts();
    $("tabSub").classList.toggle("on", mode === "sub"); $("tabDraft").classList.toggle("on", mode === "draft");
    $("latestOnly").parentElement.lastChild.textContent = mode === "sub" ? " 학번별 마지막 제출만" : " 학번별 최근 것만";
    $("count").textContent = mode === "sub"
      ? `${list.length}건 표시 / 전체 ${inClass(rows).length}건 · 학생 ${Object.keys(counts).length}명`
      : `${list.length}건 표시 / 전체 ${inClass(drafts).length}건 · 미제출 ${new Set(inClass(drafts).filter((d) => !counts[key(d.student_no)]).map((d) => key(d.student_no))).size}명`;
    const box = $("list"); box.innerHTML = "";
    if (!list.length) {
      box.appendChild(el("div", null, mode === "sub" ? "제출물이 없습니다." : "자동저장된 작성 내용이 없습니다.")).style.cssText = "padding:16px;color:var(--muted)";
      return;
    }
    list.forEach((r) => {
      const b = el("button", "item" + (r.id === selectedId ? " sel" : "")); b.type = "button";
      const top = el("div", "top");
      const who = el("span", "who", `${r.student_no} ${r.student_name}`);
      const n = counts[key(r.student_no)] || 0;
      if (CLASSES.length && curClass === ALL) who.appendChild(el("span", "tag cls", className(r.class_id)));
      if (mode === "sub" && n > 1) who.appendChild(el("span", "tag", `${n}회 제출`));
      if (mode === "draft") who.appendChild(el("span", "tag" + (n ? " ok" : ""), n ? "제출함" : "미제출"));
      if (r.restore_until && new Date(r.restore_until) > new Date()) who.appendChild(el("span", "tag wait", "복원 대기"));
      top.append(who, el("span", "when", (mode === "draft" ? "저장 " : "") + fmtTime(r.created_at)));
      const att = (r.attachments || []).length;
      b.append(top, el("div", "s", r.subject || "(제목 없음)"),
        el("div", "meta", `받는 사람 ${r.to_addrs.length} · 참조 ${r.cc_addrs.length} · 숨은 참조 ${r.bcc_addrs.length}` + (att ? ` · 첨부 ${att}` : "")));
      b.addEventListener("click", () => { selectedId = r.id; renderList(); renderDetail(r); });
      box.appendChild(b);
    });
  }
  function setMode(m) {
    mode = m; selectedId = null;
    $("detail").innerHTML = `<div class="empty">왼쪽 목록에서 ${m === "sub" ? "제출물" : "작성 내용"}을 선택하세요.</div>`;
    renderList();
  }
  $("tabSub").addEventListener("click", () => setMode("sub"));
  $("tabDraft").addEventListener("click", () => setMode("draft"));
  $("q").addEventListener("input", renderList);
  $("latestOnly").addEventListener("change", renderList);
  $("reloadBtn").addEventListener("click", () => { loadExam(); load(); });

  // ---------- 상세 ----------
  async function renderDetail(r) {
    const d = $("detail"); d.innerHTML = "";
    const actions = el("div", "actions");
    if (r._draft) actions.append(btn("복원 허용 (10분)", "primary", () => allowRestore(r)));
    actions.append(btn("인쇄", "", () => window.print()), btn("삭제", "danger", () => del(r)));
    d.appendChild(actions);
    const clsLabel = CLASSES.length ? className(r.class_id) + " · " : "";
    if (r._draft) {
      d.appendChild(el("div", "help",
        "학생 PC가 재부팅되었다면 [복원 허용]을 누른 뒤, 학생에게 같은 학번·이름을 다시 입력하라고 하세요. " +
        "10분 안에 학생 화면에 '불러올까요?' 안내가 뜹니다(한 번 불러가면 끝). 첨부파일은 자동저장되지 않습니다."));
      d.appendChild(el("div", "stu", `${clsLabel}${r.student_no} ${r.student_name} · 마지막 자동저장 ${fmtFull(r.created_at)}` +
        (r.restore_until && new Date(r.restore_until) > new Date() ? ` · 복원 대기 중(~${new Date(r.restore_until).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })})` : "")));
    } else {
      d.appendChild(el("div", "stu", `${clsLabel}${r.student_no} ${r.student_name} · 제출 ${fmtFull(r.created_at)} · 접수번호 ${r.id.slice(0, 8).toUpperCase()}`));
    }

    const v = el("div", "mailview");
    v.appendChild(el("h3", "subj" + (r.subject ? "" : " empty"), r.subject || "(제목 없음)"));
    const dl = el("dl");
    const add = (k, val) => dl.append(el("dt", null, k), el("dd", null, val || "(없음)"));
    add("보내는 사람", r.sender);
    add("받는 사람", r.to_addrs.join(", "));
    add("참조", r.cc_addrs.join(", "));
    add("숨은 참조", r.bcc_addrs.join(", "));
    v.appendChild(dl);
    v.appendChild(el("div", "body", r.body || "(본문 없음)"));
    v.appendChild(el("div", "sig", r.signature || "(서명 없음)"));
    const files = r.attachments || [];
    const fl = el("div", "files");
    if (!r._draft && !files.length) fl.appendChild(el("span", "meta", "첨부파일 없음")).style.cssText = "color:var(--muted);font-size:14px";
    v.appendChild(fl);
    d.appendChild(v);

    for (const f of files) {
      const a = el("span", "attach");
      const link = el("a", "name", f.name); link.title = f.name; link.href = "#";
      a.append(link, el("span", "size", fmtSize(f.size)));
      fl.appendChild(a);
      const { data, error } = await sb.storage.from("attachments").createSignedUrl(f.path, 3600, { download: f.name });
      if (error) { link.removeAttribute("href"); link.textContent += " (불러오기 실패)"; }
      else link.href = data.signedUrl;
    }
  }

  async function allowRestore(r) {
    if (exam && !exam.open && (!CLASSES.length || (r.class_id || "") === curClass)) { alert("시험이 마감된 상태에서는 복원할 수 없습니다. 먼저 [다시 열기]를 누르세요."); return; }
    const { error } = await sb.rpc("allow_restore", { p_id: r.id });
    if (error) { alert("복원 허용 실패: " + error.message); return; }
    const dr = drafts.find((x) => x.id === r.id);
    if (dr) dr.restore_until = new Date(Date.now() + 10 * 60000).toISOString();
    r.restore_until = dr && dr.restore_until;
    alert(`복원을 허용했습니다.\n${r.student_no} ${r.student_name} 학생에게 학번과 이름을 다시 입력하라고 안내하세요. (10분간 유효)`);
    renderList(); renderDetail(r);
  }

  async function del(r) {
    const what = r._draft ? "자동저장된 작성 내용" : "제출물";
    if (!confirm(`${r.student_no} ${r.student_name} 학생의 ${what}(${fmtTime(r.created_at)})을 삭제할까요? 되돌릴 수 없습니다.`)) return;
    if (!r._draft) {
      const paths = (r.attachments || []).map((f) => f.path);
      if (paths.length) await sb.storage.from("attachments").remove(paths);
    }
    const { error } = await sb.from(r._draft ? "drafts" : "submissions").delete().eq("id", r.id);
    if (error) { alert("삭제 실패: " + error.message); return; }
    if (r._draft) drafts = drafts.filter((x) => x.id !== r.id); else rows = rows.filter((x) => x.id !== r.id);
    selectedId = null;
    $("detail").innerHTML = '<div class="empty">삭제했습니다.</div>';
    renderList();
  }

  // ---------- CSV ----------
  $("csvBtn").addEventListener("click", () => {
    const counts = submitCounts();
    const head = [...(CLASSES.length ? ["반"] : []), mode === "sub" ? "제출시각" : "마지막 자동저장", "학번", "이름", "보내는 사람", "받는 사람", "참조", "숨은 참조", "제목", "본문", "서명",
      mode === "sub" ? "첨부파일" : "제출 여부", mode === "sub" ? "접수번호" : "구분"];
    const lines = [head];
    visibleRows().forEach((r) => lines.push([
      ...(CLASSES.length ? [className(r.class_id)] : []), fmtFull(r.created_at), r.student_no, r.student_name, r.sender || "",
      r.to_addrs.join(", "), r.cc_addrs.join(", "), r.bcc_addrs.join(", "), r.subject || "", r.body || "", r.signature || "",
      mode === "sub" ? (r.attachments || []).map((f) => f.name).join(", ") : (counts[key(r.student_no)] ? "제출함" : "미제출"),
      mode === "sub" ? r.id.slice(0, 8).toUpperCase() : "자동저장",
    ]));
    const csv = "﻿" + lines.map((l) => l.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = `이메일수행평가_${CLASSES.length && curClass !== ALL ? className(curClass) + "_" : ""}${mode === "sub" ? "제출물" : "자동저장"}_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
})();
</script>
</body>
</html>
